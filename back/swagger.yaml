swagger: '2.0'
info:
  title: Bank Argent API documentation
  description: Contains all available API endpoints in this codebase
  version: '1.0.0'
  termsOfService: 'http://swagger.io/terms/'
host: localhost:3001
basePath: /api/v1
schemes:
  - http
paths:
  /user/login:
    post:
      tags:
        - User Module
      summary: Login
      description: API for Login
      parameters:
        - in: body
          name: body
          description: Login Payload
          required: true
          schema:
            $ref: '#/definitions/Login'
      produces:
        - application/json
      responses:
        '200':
          description: Login Successfully
          schema:
            $ref: '#/definitions/LoginResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error

  /user/signup:
    post:
      tags:
        - User Module
      summary: Signup
      description: API for Signup
      parameters:
        - in: body
          name: body
          description: Signup Payload
          required: true
          schema:
            $ref: '#/definitions/User'
      produces:
        - application/json
      responses:
        '200':
          description: Signup Successfully
          schema:
            $ref: '#/definitions/ApiResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error

  /user/profile:
    post:
      security:
        - Bearer: []
      tags:
        - User Module
      summary: User Profile API
      description: API for fetching a user profile
      parameters:
        - in: header
          name: Authorization
          description: Attach Bearer JWT token
          required: true
          type: string
      produces:
        - application/json
      responses:
        '200':
          description: User profile retrieved successfully
          schema:
            $ref: '#/definitions/ApiResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
    put:
      security:
        - Bearer: []
      tags:
        - User Module
      summary: User Profile API
      description: API for updating a user profile
      parameters:
        - in: header
          name: Authorization
          description: Attach Bearer JWT token
          required: true
          type: string
        - in: body
          name: body
          description: Update user profile attributes
          required: true
          schema:
            $ref: '#/definitions/UserProfile'
      produces:
        - application/json
      responses:
        '200':
          description: User profile updated successfully
          schema:
            $ref: '#/definitions/ApiResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error

  /accounts/{accountId}/transactions:
    get:
      security:
        - Bearer: []
      tags:
        - Transactions
      summary: Get all transactions for a specific account
      description: Returns a list of all transactions for a specific account
      parameters:
        - in: header
          name: Authorization
          description: Attach Bearer JWT token
          required: true
          type: string
        - in: path
          name: accountId
          required: true
          type: string
          description: Account ID
      produces:
        - application/json
      responses:
        '200':
          description: List of transactions retrieved
          schema:
            type: array
            items:
              $ref: '#/definitions/TransactionSummary'
        '401':
          description: Unauthorized
        '404':
          description: Account not found
        '500':
          description: Internal Server Error

  /transactions/{id}:
    get:
      security:
        - Bearer: []
      tags:
        - Transactions
      summary: Get transaction details
      description: Returns detailed information for a single transaction (expanded view).
      parameters:
        - in: header
          name: Authorization
          description: Attach Bearer JWT token
          required: true
          type: string
        - in: path
          name: id
          required: true
          type: string
          description: Transaction ID
      produces:
        - application/json
      responses:
        '200':
          description: Transaction details retrieved
          schema:
            $ref: '#/definitions/TransactionDetail'
        '404':
          description: Transaction not found
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error

    patch:
      security:
        - Bearer: []
      tags:
        - Transactions
      summary: Partially update a transaction (category, notes)
      description: Allows user to update category or notes of a transaction
      parameters:
        - in: header
          name: Authorization
          description: Attach Bearer JWT token
          required: true
          type: string
        - in: path
          name: id
          required: true
          type: string
          description: Transaction ID
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/TransactionUpdate'
      produces:
        - application/json
      responses:
        '200':
          description: Transaction updated successfully
          schema:
            $ref: '#/definitions/TransactionUpdateResponse'
        '400':
          description: Invalid data
        '404':
          description: Transaction not found
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error

securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header

definitions:
  User:
    properties:
      email:
        type: string
        description: user email
        example: john.doe@example.com
      password:
        type: string
        description: user password
        example: Password123!
      firstName:
        type: string
        description: user first name
        example: John
      lastName:
        type: string
        description: user last name
        example: Doe

  Login:
    properties:
      email:
        type: string
        description: user email
        example: john.doe@example.com
      password:
        type: string
        description: user password
        example: Password123!

  ApiResponse:
    type: object
    properties:
      status:
        type: integer
        example: 200
      message:
        type: string
        example: Success
      body:
        type: object
        properties:
          id:
            type: string
            example: 507f1f77bcf86cd799439011
          email:
            type: string
            example: john.doe@example.com

  LoginResponse:
    type: object
    properties:
      token:
        type: string
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

  UserProfile:
    type: object
    properties:
      firstName:
        type: string
        example: Josh
      lastName:
        type: string
        example: Doe

  TransactionSummary:
    type: object
    properties:
      id:
        type: string
        example: tx123456
      date:
        type: string
        format: date
        example: 2025-04-10
      description:
        type: string
        example: Golden Sun Bakery
      amount:
        type: number
        format: float
        example: 50
      balance:
        type: number
        format: float
        example: 2187.79

  TransactionDetail:
    type: object
    properties:
      id:
        type: string
        example: tx123456
      date:
        type: string
        example: 2025-04-10
      description:
        type: string
        example: Golden Sun Bakery
      amount:
        type: number
        example: -50
      balance:
        type: number
        format: float
        example: 2187.79
      transactionType:
        type: string
        example: Electronic
      category:
        type: string
        example: Food
      notes:
        type: string
        example: Bought baguettes and croissants

  TransactionUpdate:
    type: object
    properties:
      category:
        type: string
        example: Food
      notes:
        type: string
        example: Updated note about the transaction

  TransactionUpdateResponse:
    type: object
    properties:
      category:
        type: string
        example: Food
      notes:
        type: string
        example: Updated note about the transaction
        